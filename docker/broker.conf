brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 关键：应用在宿主机上跑，broker 必须把「宿主机可访问的地址」注册到 NameServer，
# 否则客户端拿到容器内网 IP（172.x）会连不上。
brokerIP1 = 127.0.0.1

# 学习环境建议打开，省去手工建 topic 的麻烦
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 关闭 VIP 通道，避免部分环境端口不通
brokerVIPChannelEnabled = false
